<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — RW2</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&family=Space+Mono&display=swap" rel="stylesheet"/>
  
  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/style.css"/>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .error-container {
      text-align: center;
      z-index: 10;
    }

    .four-oh-four {
      font-family: var(--font-bebas);
      font-size: clamp(8rem, 30vw, 25rem);
      line-height: 0.8;
      color: var(--text-color);
      position: relative;
      margin-bottom: 1rem;
    }

    .error-msg {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .error-sub {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .back-btn {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-color);
      text-decoration: none;
      border: 1px solid var(--border-color);
      padding: 1rem 2rem;
      border-radius: 4px;
      transition: all 0.3s;
    }

    .back-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: rgba(232, 0, 10, 0.05);
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="scanline"></div>

  <div class="error-container">
    <h1 class="four-oh-four">404</h1>
    <p class="error-msg">SIGNAL LOST</p>
    <p class="error-sub">THE NODE YOU ARE LOOKING FOR IS OFFLINE</p>
    <a href="index.html" class="back-btn">← RECONNECT TO RW2</a>
  </div>

</body>
</html>
