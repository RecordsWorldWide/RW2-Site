<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — RW2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red: #e8000a;
      --white: #f0ede8;
      --black: #080808;
      --muted: #444;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:var(--black); color:var(--white); font-family:'Space Mono',monospace; overflow:hidden; }

    /* NOISE */
    body::before {
      content:''; position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:.04;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:200px 200px; animation:grain .35s steps(1) infinite;
    }
    @keyframes grain {
      0%,100%{background-position:0 0} 10%{background-position:-5% -10%} 20%{background-position:-15% 5%}
      30%{background-position:7% -25%} 40%{background-position:-5% 25%} 50%{background-position:-15% 10%}
      60%{background-position:15% 0%} 70%{background-position:0% 15%} 80%{background-position:3% 35%} 90%{background-position:-10% 10%}
    }

    /* GRID */
    .grid-bg {
      position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.02;
      background-image:linear-gradient(to right,#fff 1px,transparent 1px),linear-gradient(to bottom,#fff 1px,transparent 1px);
      background-size:3.5rem 3.5rem;
    }

    /* SCANLINE */
    @keyframes scanmove { 0%{top:-5%} 100%{top:105%} }
    .scanline { position:fixed; left:0; width:100%; height:1px; background:rgba(255,255,255,.04); pointer-events:none; z-index:9998; animation:scanmove 5s linear infinite; }

    /* STAGE */
    .stage {
      position:relative; z-index:1; width:100%; height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:0;
    }

    /* BIG 404 */
    .four-oh-four {
      position:relative;
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(7rem,28vw,22rem);
      letter-spacing:-.02em;
      line-height:.85;
      color:var(--white);
      user-select:none;
      animation:flicker 6s infinite;
    }

    /* RGB glitch layers */
    .four-oh-four::before,
    .four-oh-four::after {
      content:'404';
      position:absolute;
      top:0; left:0;
      font-family:'Bebas Neue',sans-serif;
      font-size:inherit;
      letter-spacing:inherit;
      line-height:inherit;
    }
    .four-oh-four::before {
      color:var(--red);
      animation:glitch-r 3.5s infinite;
      clip-path:polygon(0 20%,100% 20%,100% 40%,0 40%);
    }
    .four-oh-four::after {
      color:#00eaff;
      animation:glitch-b 3.5s infinite;
      clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%);
    }

    @keyframes glitch-r {
      0%,90%,100%{transform:translate(0,0);opacity:0;}
      91%{transform:translate(-4px,2px);opacity:.7;}
      92%{transform:translate(4px,-1px);opacity:.5;}
      93%{transform:translate(-2px,0);opacity:.8;}
      95%{transform:translate(0,0);opacity:0;}
    }
    @keyframes glitch-b {
      0%,90%,100%{transform:translate(0,0);opacity:0;}
      91%{transform:translate(4px,-2px);opacity:.6;}
      93%{transform:translate(-3px,1px);opacity:.7;}
      95%{transform:translate(0,0);opacity:0;}
    }
    @keyframes flicker {
      0%,96%,100%{opacity:1;}
      97%{opacity:.85;}
      98%{opacity:1;}
      99%{opacity:.7;}
    }

    /* MIDDLE ROW: code line */
    .error-code {
      font-size:clamp(.5rem,.9vw,.7rem);
      letter-spacing:.35em;
      text-transform:uppercase;
      color:var(--muted);
      margin:.5rem 0 2.5rem;
      position:relative;
    }

    .error-code .blink {
      display:inline-block;
      width:8px; height:1em;
      background:var(--red);
      vertical-align:middle;
      margin-left:4px;
      animation:blink .9s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

    /* MESSAGE */
    .error-msg {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1.2rem,3vw,2.2rem);
      letter-spacing:.12em;
      color:var(--white);
      text-align:center;
      margin-bottom:.6rem;
    }

    .error-sub {
      font-size:clamp(.5rem,.8vw,.65rem);
      letter-spacing:.3em;
      text-transform:uppercase;
      color:var(--muted);
      text-align:center;
      line-height:1.8;
      margin-bottom:3rem;
    }

    /* BACK LINK */
    .back-link {
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      font-family:'Space Mono',monospace;
      font-size:.65rem;
      letter-spacing:.25em;
      text-transform:uppercase;
      color:var(--white);
      text-decoration:none;
      border:1px solid var(--muted);
      padding:.65rem 1.4rem;
      position:relative;
      overflow:hidden;
      transition:border-color .25s,color .25s;
    }

    .back-link::before {
      content:'';
      position:absolute;
      left:-100%; top:0; bottom:0;
      width:100%;
      background:var(--red);
      transition:left .3s ease;
      z-index:0;
    }

    .back-link:hover::before { left:0; }
    .back-link:hover { border-color:var(--red); color:#fff; }
    .back-link span { position:relative; z-index:1; }

    /* CORNER LABELS */
    .corner { position:fixed; font-size:.55rem; letter-spacing:.3em; text-transform:uppercase; color:#2a2a2a; }
    .corner.tl { top:1.5rem; left:1.5rem; }
    .corner.tr { top:1.5rem; right:1.5rem; text-align:right; }
    .corner.bl { bottom:1.5rem; left:1.5rem; }
    .corner.br { bottom:1.5rem; right:1.5rem; text-align:right; }

    /* HORIZONTAL LINES */
    .h-line {
      position:absolute;
      left:0; right:0;
      height:1px;
      background:linear-gradient(to right,transparent,#1e1e1e 20%,#1e1e1e 80%,transparent);
    }
    .h-line.top { top:12%; }
    .h-line.bot { bottom:12%; }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="stage">
  <div class="h-line top"></div>

  <div class="four-oh-four" id="glitch404">404</div>

  <div class="error-code">
    signal_not_found · node_offline<span class="blink"></span>
  </div>

  <div class="error-msg">This page doesn't exist</div>
  <div class="error-sub">
    lost somewhere between the static<br>
    nothing here · keep searching
  </div>

  <a class="back-link" href="index.html">
    <span>← return to rw2</span>
  </a>

  <div class="h-line bot"></div>
</div>

<div class="corner tl">RW2</div>
<div class="corner tr">Records World Wide</div>
<div class="corner bl">error :: 404</div>
<div class="corner br">2026 © RW2</div>

<script>
  // Random glitch displacement on the big number
  const el = document.getElementById('glitch404');
  setInterval(() => {
    if (Math.random() > 0.92) {
      const x = (Math.random() - 0.5) * 10;
      const y = (Math.random() - 0.5) * 4;
      el.style.transform = `translate(${x}px,${y}px)`;
      setTimeout(() => el.style.transform = '', 80 + Math.random() * 120);
    }
  }, 300);
</script>

</body>
</html>
